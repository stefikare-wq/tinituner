<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060C">
<title>Radio The Core · Mini</title>
<style>
  :root{
    --void:#05060C; --deep:#080B14; --panel:#0C1020; --mod:#0A0E1A;
    --edge:rgba(140,170,255,.13); --edge2:rgba(140,170,255,.24);
    --cyan:#2FE7FF; --magenta:#FF3D9E; --lime:#B9FF45; --amber:#FFC24B;
    --ice:#EAF1FF; --muted:#8090B8;
    --e:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;padding:0;height:100%;
    overscroll-behavior:none;
  }
  body{
    background:radial-gradient(70% 44% at 10% -6%,rgba(47,231,255,.13),transparent 62%),
               radial-gradient(64% 42% at 94% 2%,rgba(255,61,158,.11),transparent 60%),var(--void);
    color:var(--ice);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.45;letter-spacing:-.012em;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
         touch-action:manipulation;-webkit-user-select:none;user-select:none}

  /* ============================================================
     LAYOUT PRINCIPAL PLEIN ÉCRAN
     ============================================================ */
  .app{
    width:100%;
    height:100vh;
    height:100dvh;                    /* support dynamique iOS */
    max-width:520px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:calc(env(safe-area-inset-top) + 8px) 10px
           calc(env(safe-area-inset-bottom) + 8px) 10px;
    overflow:hidden;                  /* pas de scroll global */
  }

  .card{
    border:1px solid var(--edge);border-radius:16px;position:relative;
    background:linear-gradient(180deg,rgba(47,231,255,.05),transparent 40%),
               linear-gradient(180deg,var(--panel),var(--deep));
    display:flex;
    flex-direction:column;
  }

  /* ---------- TOPBAR (hauteur naturelle) ---------- */
  .topbar{padding:12px 14px;flex:0 0 auto}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .orb{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--cyan);
       position:relative;flex:none}
  .orb::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--cyan)}
  .brand{font-weight:900;letter-spacing:.12em;color:#bff8ff;font-size:15px}
  .brand small{opacity:.5;font-size:9px;letter-spacing:.1em;margin-left:3px}

  .now{font-size:18px;font-weight:600;line-height:1.15;letter-spacing:-.03em;margin:0}
  .sub{font-size:12px;color:var(--muted);min-height:16px;margin-top:2px}
  .sub.live{color:var(--lime)}

  .quick-add{display:flex;gap:6px;margin-top:10px}
  .quick-add .txtin{flex:1;min-width:0;min-height:40px;font-size:13px;
                    border-radius:10px;padding:0 12px}
  .quick-add .pill{flex:0 0 auto;min-height:40px;padding:0 14px;
                   font-size:18px;line-height:1;font-weight:700}

  .tb-btns{display:flex;gap:6px;margin-top:8px}
  .pill{display:inline-flex;align-items:center;justify-content:center;
        border-radius:100px;min-height:42px;padding:0 18px;font-size:14px;font-weight:600;
        background:linear-gradient(135deg,var(--cyan),#0E8BDD);color:#03121A;
        transition:transform .18s var(--e),filter .22s var(--e);flex:1}
  .pill:active{transform:scale(.97)}
  .pill.ghost{background:rgba(234,241,255,.06);color:var(--ice);
              border:1px solid var(--edge2);flex:0 0 auto;padding:0 14px}
  .pill.stop{background:linear-gradient(135deg,#FF3D9E,#B01E75);color:#fff}

  /* ---------- WAVE ---------- */
  .wavewrap{padding:0 14px 10px;flex:0 0 auto}
  .wave{display:flex;align-items:flex-end;gap:2px;height:22px;width:100%}
  .wave i{flex:1;border-radius:2px;height:3px;background:var(--cyan);opacity:.22;
          transition:height .08s linear,opacity .4s var(--e)}
  .wave.on i{opacity:.9}

  /* ---------- CONSOLE (prend l'espace restant) ---------- */
  .console{
    padding:12px 14px;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow-y:auto;                  /* scroll interne si trop petit */
    -webkit-overflow-scrolling:touch;
  }
  .console::-webkit-scrollbar{width:5px}
  .console::-webkit-scrollbar-thumb{background:rgba(234,241,255,.13);border-radius:99px}

  .ctitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex:0 0 auto}
  .ctitle h2{font-size:10.5px;letter-spacing:.18em;margin:0;color:var(--cyan);font-weight:800}
  .ctitle .val{font-size:11px;color:var(--muted)}

  .row{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:center;
       margin-bottom:8px;flex:0 0 auto}
  .row .lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
  .row .val{font-size:11px;color:var(--ice);text-align:right;
            font-variant-numeric:tabular-nums;grid-column:2;margin-top:-3px;margin-bottom:1px}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;
                    background:transparent;margin:0;display:block;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;
    background:linear-gradient(90deg,var(--c,var(--cyan)) var(--p,50%),
               rgba(234,241,255,.1) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:18px;height:18px;border-radius:50%;margin-top:-6.5px;background:#fff;
    border:2px solid var(--c,var(--cyan));transition:transform .16s var(--e)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
  input[type=range].center::-webkit-slider-runnable-track{
    background:linear-gradient(90deg,
      rgba(234,241,255,.1) 0%, rgba(234,241,255,.1) var(--lo,50%),
      var(--c,var(--cyan)) var(--lo,50%), var(--c,var(--cyan)) var(--hi,50%),
      rgba(234,241,255,.1) var(--hi,50%), rgba(234,241,255,.1) 100%)}
  input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:rgba(234,241,255,.1)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;
    border:2px solid var(--c,var(--cyan))}

  /* EQ : pousse vers le bas si l'espace le permet */
  .eq{
    margin-top:auto;                  /* pousse en bas si espace dispo */
    padding-top:10px;
    border-top:1px solid var(--edge2);
    flex:0 0 auto;
  }
  .eq-title{font-size:10.5px;letter-spacing:.16em;color:var(--muted);font-weight:700;margin-bottom:8px}
  .eq-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .eq-band{display:flex;flex-direction:column;gap:4px}
  .eq-band .bhead{display:flex;justify-content:space-between;align-items:baseline}
  .eq-band .blbl{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.06em}
  .eq-band .bval{font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--c)}

  /* ============================================================
     DRAWER PAR LE BAS — PLEIN ÉCRAN
     ============================================================ */
  .drawer{
    position:fixed;
    left:0;right:0;bottom:0;
    top:auto;
    height:90vh;
    height:90dvh;
    max-height:90vh;
    width:100%;
    z-index:40;
    background:linear-gradient(180deg,#0B1020,#06080F);
    border-top-left-radius:20px;
    border-top-right-radius:20px;
    border-top:1px solid var(--edge2);
    transform:translateY(101%);
    transition:transform .32s var(--e);
    display:flex;
    flex-direction:column;
    padding:0;
    overflow:hidden;
    box-shadow:0 -20px 60px rgba(0,0,0,.6);
  }
  .drawer.open{transform:translateY(0)}

  .drawer-handle{
    display:flex;align-items:center;justify-content:center;
    padding:8px 0 4px;flex:0 0 auto;
    cursor:grab;
  }
  .drawer-handle i{
    width:44px;height:4px;border-radius:99px;
    background:rgba(140,190,255,.35);
  }

  .dhead{
    display:flex;align-items:center;justify-content:space-between;
    padding:2px 14px 10px;flex:0 0 auto;
    gap:10px;
  }
  .dhead h2{
    font-size:12px;letter-spacing:.2em;margin:0;
    color:var(--cyan);font-weight:800;
  }
  .dhead button{
    width:36px;height:36px;border-radius:50%;
    border:1px solid var(--edge2);
    background:rgba(234,241,255,.06);
    font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .dhead button:active{transform:scale(.92)}

  .dcontent{
    flex:1 1 auto;
    display:flex;flex-direction:column;
    padding:0 14px calc(env(safe-area-inset-bottom) + 14px) 14px;
    min-height:0;
    overflow:hidden;
  }

  .addtop{
    display:flex;gap:6px;margin-bottom:8px;flex:0 0 auto;
  }
  .addtop .txtin{flex:1;min-width:0;min-height:40px;font-size:13px;
                 padding:0 12px;border-radius:10px}
  .addtop .pill{
    flex:0 0 auto;min-height:40px;padding:0 16px;
    font-size:18px;line-height:1;font-weight:700;border-radius:10px;
  }

  .searchbox{margin-bottom:8px;flex:0 0 auto}

  .txtin{width:100%;font:inherit;color:var(--ice);
    background:rgba(234,241,255,.05);border:1px solid var(--edge2);
    border-radius:10px;min-height:40px;padding:0 12px;font-size:14px;
    -webkit-appearance:none;appearance:none}
  .txtin:focus{outline:none;border-color:var(--cyan)}

  .tabs{
    display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;
    margin:0 0 10px;padding-bottom:4px;flex:0 0 auto;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{
    flex:none;white-space:nowrap;font-size:12px;color:var(--muted);
    background:rgba(234,241,255,.05);border:1px solid var(--edge);
    border-radius:100px;min-height:32px;padding:0 12px;
  }
  .tabs button.sel{
    background:linear-gradient(135deg,var(--cyan),#0E8BDD);
    color:#03121A;border-color:transparent;font-weight:700;
  }

  .listwrap{
    flex:1 1 auto;
    overflow-y:auto;
    min-height:0;
    padding-right:2px;
    -webkit-overflow-scrolling:touch;
  }
  .listwrap::-webkit-scrollbar{width:5px}
  .listwrap::-webkit-scrollbar-thumb{background:rgba(234,241,255,.13);border-radius:99px}

  .rowlist{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    padding:10px 10px;border-radius:12px;border:1px solid transparent;
    transition:background .15s var(--e),border-color .15s var(--e);
  }
  .rowlist + .rowlist{margin-top:2px}
  .rowlist:hover{background:rgba(234,241,255,.05)}
  .rowlist.play{
    background:linear-gradient(90deg,rgba(47,231,255,.16),rgba(47,231,255,.02));
    border-color:rgba(47,231,255,.45);
  }
  .rowlist .dot{
    width:7px;height:7px;border-radius:50%;flex:none;
    background:rgba(234,241,255,.14);
  }
  .rowlist.play .dot{background:var(--cyan)}
  .rowlist .info{flex:1;min-width:0}
  .rowlist .nm{
    font-weight:600;font-size:14px;display:block;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .rowlist.play .nm{color:var(--cyan)}
  .rowlist .desc{
    font-size:11.5px;color:var(--muted);display:block;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .rowlist .star{
    font-size:17px;color:rgba(234,241,255,.2);padding:6px;
    flex:none;transition:all .18s var(--e);
  }
  .rowlist .star:hover{color:var(--magenta);transform:scale(1.15)}
  .rowlist .star.is{color:var(--magenta)}

  .msg{
    font-size:12px;color:var(--muted);margin-top:8px;
    line-height:1.4;flex:0 0 auto;
  }
  .msg b{color:var(--ice)}

  .scrim{
    position:fixed;inset:0;background:rgba(3,5,10,.6);z-index:39;
    opacity:0;pointer-events:none;transition:opacity .25s var(--e);
  }
  .scrim.open{opacity:1;pointer-events:auto}

  /* ============================================================
     BARRE BASSE — mobile (peut être masquée si pas assez de place)
     ============================================================ */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(5,6,12,.98);
    border-top:1px solid var(--edge);
    display:none;                     /* ⭐ masquée — la page est plein écran */
  }

  /* ============================================================
     PETIT ÉCRAN / SL — compactage
     ============================================================ */
  @media (max-width:520px), (max-height:600px){
    .app{padding:6px;gap:6px}
    .topbar{padding:10px 12px}
    .now{font-size:16px}
    .console{padding:10px 12px}
    .row{grid-template-columns:44px 1fr;gap:8px;margin-bottom:6px}
    .dcontent{padding:0 10px calc(env(safe-area-inset-bottom) + 10px) 10px}
    .rowlist{padding:9px 10px}
    .rowlist .nm{font-size:13.5px}
  }

  /* Très petit écran vertical : on masque la wave pour gagner de la place */
  @media (max-height:520px){
    .wavewrap{display:none}
    .brand-row{margin-bottom:6px}
    .quick-add{margin-top:6px}
    .tb-btns{margin-top:6px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="card topbar">
    <div class="brand-row">
      <span class="orb"></span>
      <span class="brand">RADIO THE CORE <small>• MINI</small></span>
    </div>
    <div class="now" id="npName">Rien en lecture</div>
    <div class="sub" id="npState">Ouvre les stations pour choisir</div>

    <div class="quick-add">
      <input type="text" class="txtin" id="quickUrl" inputmode="url"
             autocapitalize="off" autocorrect="off"
             placeholder="Coller un lien de flux…">
      <button class="pill" id="quickAdd">＋</button>
    </div>

    <div class="tb-btns">
      <button class="pill" id="power">▶ Écouter</button>
      <button class="pill ghost" id="openDrawer">☰ Stations</button>
    </div>
  </div>

  <div class="card wavewrap">
    <div class="wave" id="wave"></div>
  </div>

  <div class="card console">
    <div class="ctitle">
      <h2>CONSOLE</h2>
      <span class="val" id="statusMini">En veille</span>
    </div>

    <div class="row">
      <span class="lbl">VOL</span>
      <input type="range" id="volume" min="-24" max="12" step="0.5" value="0">
      <span class="val" id="volVal">0.0 dB</span>
    </div>

    <div class="row">
      <span class="lbl">BAL</span>
      <input type="range" class="center" id="balance" min="-1" max="1" step="0.01" value="0">
      <span class="val" id="balVal">Centre</span>
    </div>

    <div class="eq">
      <div class="eq-title">ÉGALISEUR</div>
      <div class="eq-grid">
        <div class="eq-band" style="--c:#FF3D9E">
          <div class="bhead"><span class="blbl">BASS</span><span class="bval" id="bassVal">0</span></div>
          <input type="range" id="bass" min="-15" max="15" step="1" value="0" style="--c:#FF3D9E">
        </div>
        <div class="eq-band" style="--c:#2FE7FF">
          <div class="bhead"><span class="blbl">MID</span><span class="bval" id="midVal">0</span></div>
          <input type="range" id="mid" min="-15" max="15" step="1" value="0" style="--c:#2FE7FF">
        </div>
        <div class="eq-band" style="--c:#B9FF45">
          <div class="bhead"><span class="blbl">HIGH</span><span class="bval" id="trelVal">0</span></div>
          <input type="range" id="treble" min="-15" max="15" step="1" value="0" style="--c:#B9FF45">
        </div>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-modal="true">
  <div class="drawer-handle" id="drawerHandle"><i></i></div>

  <div class="dhead">
    <h2>STATIONS</h2>
    <button id="closeDrawer" aria-label="Fermer">✕</button>
  </div>

  <div class="dcontent">
    <div class="addtop">
      <input type="text" class="txtin" id="url" inputmode="url"
             autocapitalize="off" autocorrect="off"
             placeholder="Coller un lien de flux…">
      <button class="pill" id="addUrl">＋</button>
    </div>

    <div class="searchbox">
      <input type="text" class="txtin" id="search" placeholder="Chercher une station…"
             autocapitalize="off" autocorrect="off">
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="listwrap">
      <div id="list"></div>
      <div class="msg" id="listMsg"></div>
    </div>
  </div>
</aside>

<script>
(function(){
"use strict";

const CORS_PROXY = 'https://soft-brook-0e52.stefikare.workers.dev/?url=';

function normalizeUrl(u) {
  if (!u) return u;
  u = u.trim();
  if (u.indexOf(CORS_PROXY) === 0) return u;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  if (u.indexOf('http://') === 0) return CORS_PROXY + encodeURIComponent(u);
  return u;
}

let audioCtx = null;
let mixEl = null;
let srcNode = null;
let pannerNode = null;
let gainNode = null;
let bassFilter = null;
let midFilter = null;
let trebleFilter = null;
let analyser = null;
let _waveData = null;
let graphBuilt = false;

let isPlaying = false;
let currentStation = null;
let sessionId = 0;

const RETRY_BASE = 800;
const RETRY_MAX = 20000;
const GOOD_PLAYBACK_MS = 15000;

function buildGraph() {
  if (graphBuilt) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  mixEl = new Audio();
  mixEl.crossOrigin = 'anonymous';
  mixEl.setAttribute('playsinline', '');
  mixEl.preload = 'none';

  srcNode = audioCtx.createMediaElementSource(mixEl);
  pannerNode = audioCtx.createStereoPanner(); pannerNode.pan.value = 0;
  gainNode = audioCtx.createGain(); gainNode.gain.value = 1;

  bassFilter = audioCtx.createBiquadFilter();
  bassFilter.type = 'lowshelf'; bassFilter.frequency.value = 250; bassFilter.gain.value = 0;

  midFilter = audioCtx.createBiquadFilter();
  midFilter.type = 'peaking'; midFilter.frequency.value = 1200;
  midFilter.Q.value = 0.9; midFilter.gain.value = 0;

  trebleFilter = audioCtx.createBiquadFilter();
  trebleFilter.type = 'highshelf'; trebleFilter.frequency.value = 4000;
  trebleFilter.gain.value = 0;

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.4;

  srcNode.connect(pannerNode);
  pannerNode.connect(gainNode);
  gainNode.connect(bassFilter);
  bassFilter.connect(midFilter);
  midFilter.connect(trebleFilter);
  trebleFilter.connect(analyser);
  analyser.connect(audioCtx.destination);

  _waveData = new Uint8Array(analyser.fftSize);
  graphBuilt = true;
}

function tryPlay(url, mySession) {
  return new Promise((resolve) => {
    if (!mixEl) { resolve(false); return; }
    let done = false, startedPlaying = false, lastProgress = Date.now();

    const finish = (ok) => {
      if (done) return;
      done = true;
      clearInterval(watchdog);
      resolve(ok);
    };

    mixEl.onplaying = () => {
      startedPlaying = true;
      lastProgress = Date.now();
      setStatus('▶ En direct');
      render();
    };
    mixEl.onwaiting = () => { if (startedPlaying) setStatus('⏳ Buffer...'); };
    mixEl.onerror = () => { setStatus('❌ Erreur'); finish(false); };
    mixEl.onended = () => finish(startedPlaying);
    mixEl.ontimeupdate = () => { lastProgress = Date.now(); };

    const watchdog = setInterval(() => {
      if (done) return;
      if (sessionId !== mySession || !isPlaying) { finish(false); return; }
      const idle = Date.now() - lastProgress;
      if (!startedPlaying && idle > 15000) { setStatus('❌ Pas de réponse'); finish(false); }
      else if (startedPlaying && idle > 12000) { setStatus('❌ Flux interrompu'); finish(false); }
    }, 1000);

    try {
      mixEl.src = url;
      mixEl.load();
      const p = mixEl.play();
      if (p && p.catch) p.catch(() => finish(false));
    } catch (e) { finish(false); }
  });
}

async function streamSession(station, mySession) {
  const rawUrls = [station.u].concat(station.alts || []).filter(Boolean);
  const urls = rawUrls.map(normalizeUrl);

  if (urls[0] !== rawUrls[0]) {
    console.info('[Core Mini] HTTP → proxy :', urls[0]);
  }

  let attempt = 0, urlIdx = 0;
  while (isPlaying && sessionId === mySession) {
    const url = urls[urlIdx % urls.length];
    setStatus('⏳ Connexion...');
    const startTs = Date.now();
    const ok = await tryPlay(url, mySession);
    const playedFor = Date.now() - startTs;
    if (!isPlaying || sessionId !== mySession) return;

    if (ok && playedFor >= GOOD_PLAYBACK_MS) {
      attempt = 0; urlIdx = 0;
      setStatus('🔄 Reconnexion...');
    } else {
      attempt++; urlIdx++;
      setStatus('🔄 Tentative ' + attempt + '...');
    }

    try { mixEl.pause(); } catch(e) {}
    try { mixEl.removeAttribute('src'); mixEl.load(); } catch(e) {}

    const delay = Math.min(RETRY_BASE * Math.pow(1.6, Math.max(0, attempt - 1)), RETRY_MAX);
    setStatus('🔄 Reconnexion dans ' + (delay/1000).toFixed(1) + 's...');
    await new Promise(r => setTimeout(r, delay + Math.random() * 700));
  }
}

async function togglePlay(station) {
  if (isPlaying) {
    isPlaying = false;
    sessionId++;
    try { mixEl.pause(); } catch(e) {}
    try { mixEl.removeAttribute('src'); mixEl.load(); } catch(e) {}
    render();
    setStatus('⏹️ Arrêté.');
    return;
  }
  if (!station) { setStatus('⚠️ Aucune station.'); return; }

  currentStation = station;
  isPlaying = true;
  const mySession = ++sessionId;

  buildGraph();
  if (audioCtx.state === 'suspended') {
    try { await audioCtx.resume(); } catch(e) {}
  }

  render();
  try { await streamSession(station, mySession); }
  catch (err) {
    if (sessionId !== mySession) return;
    setStatus('❌ ' + err.message);
    isPlaying = false;
    render();
  }
}

}
function fip(id,n,c,g){

          alts:['https://icecast.radiofrance.fr/'+id+'-lofi.mp3']};
}

let tab = 'all', query = '', online = [], favs = [], plays = {};
try { favs = JSON.parse(localStorage.getItem('core_favs') || '[]'); } catch(e){ favs = []; }

function savePlays(){ try{ localStorage.setItem('core_plays', JSON.stringify(plays)); }catch(e){} }

const npName = document.getElementById('npName');
const npState = document.getElementById('npState');
const statusMini = document.getElementById('statusMini');
const waveEl = document.getElementById('wave');
const listMsg = document.getElementById('listMsg');
const listEl = document.getElementById('list');
const tabsEl = document.getElementById('tabs');

function setStatus(msg) {
  npState.textContent = msg;
  statusMini.textContent = msg;
}
function title(t) {
  npName.textContent = t;
}
function render() {
  const p = isPlaying;
  waveEl.classList.toggle('on', p);
  npState.classList.toggle('live', p);
  const btn = document.getElementById('power');
  if (btn) {
    btn.textContent = p ? '⏹ Stop' : '▶ Écouter';
    btn.classList.toggle('stop', p);
  }
}

function playStation(st) {
  currentStation = st;
  title(st.n);
  render();
  plays[st.u] = (plays[st.u] || 0) + 1;
  savePlays();

  if (isPlaying) {
    isPlaying = false;
    sessionId++;
    try { mixEl.pause(); } catch(e) {}
    try { mixEl.removeAttribute('src'); mixEl.load(); } catch(e) {}
    setTimeout(() => { isPlaying = true; togglePlay(st); }, 100);
  } else {
    togglePlay(st);
  }
}

TABS.forEach(t => {
  const b = document.createElement('button');
  b.textContent = t.label;
  if (t.id === tab) b.classList.add('sel');
  b.addEventListener('click', () => {
    tab = t.id;
    tabsEl.querySelectorAll('button').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    paintList();
  });
  tabsEl.appendChild(b);
});

function filterRows() {
  if (query) {
    const q = query.toLowerCase();
    return CORE.concat(online).filter(s =>
      (s.n + ' ' + (s.g||'') + ' ' + (s.c||'')).toLowerCase().indexOf(q) >= 0
    );
  }
  if (tab === 'fav') return favs.slice();
  if (tab === 'all') return CORE.slice();
  return CORE.filter(s => s.c === tab);
}

function paintList() {
  const rows = filterRows();
  listEl.innerHTML = '';

  if (!rows.length && tab === 'fav') {
    listMsg.textContent = 'Aucun favori pour l\'instant.';
    return;
  }
  if (!rows.length && query) {
    listMsg.innerHTML = '<b>Rien trouvé.</b>';
    return;
  }
  listMsg.textContent = '';

  rows.forEach(st => {
    const r = document.createElement('button');
    r.className = 'rowlist';
    if (currentStation && currentStation.u === st.u) r.className += ' play';

    const isFav = favs.some(x => x.u === st.u);

    r.innerHTML = '<i class="dot"></i>'
      + '<span class="info"><span class="nm"></span><span class="desc"></span></span>'
      + '<span class="star' + (isFav ? ' is' : '') + '">★</span>';

    r.querySelector('.nm').textContent = st.n;
    const descParts = [];
    if (st.g) descParts.push(st.g);
    if (st.q) descParts.push(st.q);
    r.querySelector('.desc').textContent = descParts.join(' · ');

    r.addEventListener('click', () => {
      playStation(st);
      openDrawer(false);
    });
    r.querySelector('.star').addEventListener('click', ev => {
      ev.stopPropagation(); ev.preventDefault();
      toggleFav(st);
    });

    listEl.appendChild(r);
  });
}

function toggleFav(st) {
  const i = favs.findIndex(x => x.u === st.u);
  if (i >= 0) favs.splice(i, 1); else favs.push(st);
  saveFavs();
  paintList();
}

let searchTimer = null;
document.getElementById('search').addEventListener('input', function() {
  query = this.value.trim();
  paintList();
  clearTimeout(searchTimer);
  if (query.length < 2) { online = []; return; }
  searchTimer = setTimeout(() => searchLibrary(query), 450);
});

function searchLibrary(q) {
  listMsg.innerHTML = '<b>Recherche…</b>';
  const base = 'https://de1.api.radio-browser.info/json/stations/search?hidebroken=true'
    + '&order=clickcount&reverse=true&limit=30&';
  Promise.all([
    fetch(base + 'tag=' + encodeURIComponent(q)).then(r => r.json()).catch(() => []),
    fetch(base + 'name=' + encodeURIComponent(q)).then(r => r.json()).catch(() => [])
  ]).then(sets => {
    if (query !== q) return;
    const have = {}, out = [];
    CORE.forEach(x => have[x.u] = 1);
    sets.forEach(rows => (rows || []).forEach(r => {
      const u = r.url_resolved || r.url;
      if (!u || u.indexOf('https://') !== 0 || have[u]) return;
      have[u] = 1;
      out.push({
        n: (r.name || '').trim().slice(0, 46) || 'Sans nom',
        g: (r.tags || '').split(',').slice(0, 2).join(', '),
        c: 'web',
        q: (r.bitrate ? r.bitrate + ' kbps' : ''),
        u: u, alts: []
      });
    }));
    online = out;
    listMsg.innerHTML = out.length
      ? '<b>' + out.length + ' stations trouvées.</b>'
      : '<b>Rien pour ce mot.</b>';
    paintList();
  }).catch(() => {
    listMsg.innerHTML = '<b>Bibliothèque injoignable.</b>';
  });
}

document.getElementById('addUrl').addEventListener('click', () => {
  const box = document.getElementById('url');
  addStreamFromValue(box.value, box);
});
document.getElementById('quickAdd').addEventListener('click', () => {
  const box = document.getElementById('quickUrl');
  addStreamFromValue(box.value, box);
});
document.getElementById('quickUrl').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); addStreamFromValue(this.value, this); }
});
document.getElementById('url').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); addStreamFromValue(this.value, this); }
});

function addStreamFromValue(rawValue, box) {
  let u = (rawValue || '').trim();
  if (!u) { listMsg.textContent = 'Colle un lien de flux.'; return; }

  const wasHttp = /^http:\/\//i.test(u);
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;

  const st = {
    n: u.replace(/^https?:\/\//i, '').split('/')[0].slice(0, 30),
    g: wasHttp ? 'Flux rapide (proxy auto)' : 'Flux ajouté',
    c: 'all',
    q: '',
    u: u,
    alts: []
  };

  const existing = CORE.find(x => x.u === u);
  if (existing) {
    if (box) box.value = '';
    playStation(existing);
    return;
  }

  CORE.push(st);
  if (box) box.value = '';
  listMsg.innerHTML = wasHttp
    ? '<b>✓ Ajouté.</b> HTTP → proxy HTTPS auto.'
    : '<b>✓ Ajouté.</b>';
  playStation(st);
}

const drawer = document.getElementById('drawer');

function openDrawer(o) {

(function(){
  const handle = document.getElementById('drawerHandle');
  if (!handle) return;
  let startY = 0, dragging = false;
  handle.addEventListener('touchstart', e => {
    startY = e.touches[0].clientY;
    dragging = true;
  }, {passive:true});
  handle.addEventListener('touchmove', e => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 60) {
      dragging = false;
      openDrawer(false);
    }
  }, {passive:true});
  handle.addEventListener('touchend', () => { dragging = false; });
})();

document.getElementById('power').addEventListener('click', () => {

});

function fillPct(slider, centered) {
  const min = +slider.min, max = +slider.max, v = +slider.value;
  const pct = ((v - min) / (max - min)) * 100;
  if (centered) {
    const c = ((0 - min) / (max - min)) * 100;
    slider.style.setProperty('--lo', Math.min(c, pct) + '%');
    slider.style.setProperty('--hi', Math.max(c, pct) + '%');
  } else {
    slider.style.setProperty('--p', pct + '%');
  }
}

const midSlider = document.getElementById('mid');

function updateVolume() {
  const v = +volSlider.value;
  document.getElementById('volVal').textContent = (v > 0 ? '+' : '') + v.toFixed(1);
  if (gainNode) gainNode.gain.value = Math.pow(10, v / 20);

function updateBalance() {
  const v = +balSlider.value;
  const txt = v === 0 ? 'Centre'
    : (v < 0 ? 'G ' + Math.abs(v).toFixed(2) : 'D ' + v.toFixed(2));
  document.getElementById('balVal').textContent = txt;
  if (pannerNode) pannerNode.pan.value = v;
  fillPct(balSlider, true);
}
function updateBass() {
  const v = +bassSlider.value;
  document.getElementById('bassVal').textContent = (v > 0 ? '+' : '') + v;
  if (bassFilter) bassFilter.gain.value = v;
  fillPct(bassSlider, false);
}
function updateMid() {
  const v = +midSlider.value;
  document.getElementById('midVal').textContent = (v > 0 ? '+' : '') + v;
  if (midFilter) midFilter.gain.value = v;
  fillPct(midSlider, false);
}
function updateTreble() {

volSlider.addEventListener('input', updateVolume);

updateVolume(); updateBalance(); updateBass(); updateMid(); updateTreble();

const BARS = 28;
const barEls = [];
for (let i = 0; i < BARS; i++) {
  const e = document.createElement('i');
  waveEl.appendChild(e);
  barEls.push(e);
}

let idle = 0, lastFrame = 0;
(function loop(now) {
  requestAnimationFrame(loop);
  const t = now || performance.now();
  if (t - lastFrame < 40) return;
  lastFrame = t;

  const playing = isPlaying;
  const live = playing && analyser && _waveData;

  if (live) {
    try {
      analyser.getByteTimeDomainData(_waveData);
      const step = Math.floor(_waveData.length / BARS);
      for (let k = 0; k < BARS; k++) {
        const idx = Math.min(k * step + 20, _waveData.length - 1);
        const h = Math.max(3, Math.abs(_waveData[idx] - 128) / 128 * 34);
        barEls[k].style.height = h + 'px';
      }
    } catch(e){}
  } else {
    idle += 0.06;
    for (let k = 0; k < BARS; k++) {
      const h = playing
        ? (9 + Math.sin(idle + k*0.4) * 7 + Math.sin(idle*1.7 + k) * 3)
        : 3;
      barEls[k].style.height = h + 'px';
    }
  }
})();

paintList();
render();
setStatus('Ouvre les stations pour choisir');

})();
