<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05060C">
<title>Radio The Core · Mini</title>
<style>
  :root{
    --void:#05060C; --deep:#080B14; --panel:#0C1020; --mod:#0A0E1A;
    --edge:rgba(140,170,255,.13); --edge2:rgba(140,170,255,.24);
    --cyan:#2FE7FF; --magenta:#FF3D9E; --lime:#B9FF45; --amber:#FFC24B;
    --ice:#EAF1FF; --muted:#8090B8;
    --e:cubic-bezier(.32,.72,0,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:radial-gradient(70% 44% at 10% -6%,rgba(47,231,255,.13),transparent 62%),
               radial-gradient(64% 42% at 94% 2%,rgba(255,61,158,.11),transparent 60%),var(--void);
    color:var(--ice);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.45;letter-spacing:-.012em;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
         touch-action:manipulation;-webkit-user-select:none;user-select:none}

  .app{width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:10px;
       padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px) 14px;
       overflow:hidden}

  .card{border:1px solid var(--edge);border-radius:16px;position:relative;
        background:linear-gradient(180deg,rgba(47,231,255,.05),transparent 40%),
                   linear-gradient(180deg,var(--panel),var(--deep));
        display:flex;flex-direction:column;overflow:hidden}

  .topbar{padding:14px 18px;flex:0 0 auto}
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .orb{width:28px;height:28px;border-radius:50%;border:3px solid var(--cyan);position:relative;flex:none}
  .orb::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--cyan)}
  .brand{font-weight:900;letter-spacing:.12em;color:#bff8ff;font-size:16px}
  .brand small{opacity:.5;font-size:10px;letter-spacing:.1em;margin-left:4px}

  .now{font-size:20px;font-weight:600;line-height:1.15;letter-spacing:-.03em;margin:0}
  .sub{font-size:12.5px;color:var(--muted);min-height:17px;margin-top:3px}
  .sub.live{color:var(--lime)}

  /* Zone d'ajout compacte : nom + url sur 2 lignes */
  .add-form{display:flex;flex-direction:column;gap:6px;margin-top:12px}
  .add-form .txtin{min-height:42px;font-size:14px;padding:0 14px}
  .add-form .row2{display:flex;gap:6px}
  .add-form .row2 .txtin{flex:1;min-width:0}

  .pill{display:inline-flex;align-items:center;justify-content:center;border-radius:100px;
        min-height:44px;padding:0 22px;font-size:14px;font-weight:600;
        background:linear-gradient(135deg,var(--cyan),#0E8BDD);color:#03121A;
        transition:transform .18s var(--e);flex:1}
  .pill:active{transform:scale(.97)}
  .pill.ghost{background:rgba(234,241,255,.06);color:var(--ice);border:1px solid var(--edge2);flex:0 0 auto;padding:0 18px}
  .pill.stop{background:linear-gradient(135deg,#FF3D9E,#B01E75);color:#fff}

  .tb-btns{display:flex;gap:8px;margin-top:10px}

  .wavewrap{padding:0 18px 12px;flex:0 0 auto}
  .wave{display:flex;align-items:flex-end;gap:2px;height:24px;width:100%}
  .wave i{flex:1;border-radius:2px;height:3px;background:var(--cyan);opacity:.22;
          transition:height .08s linear,opacity .4s var(--e)}
  .wave.on i{opacity:.9}

  .console{padding:14px 18px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
           overflow-y:auto;-webkit-overflow-scrolling:touch}
  .console::-webkit-scrollbar{width:6px}
  .console::-webkit-scrollbar-thumb{background:rgba(234,241,255,.13);border-radius:99px}

  .ctitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex:0 0 auto}
  .ctitle h2{font-size:12px;letter-spacing:.18em;margin:0;color:var(--cyan);font-weight:800}
  .ctitle .val{font-size:12px;color:var(--muted)}

  .row{display:grid;grid-template-columns:70px 1fr;gap:14px;align-items:center;margin-bottom:10px;flex:0 0 auto}
  .row .lbl{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em}
  .row .val{font-size:12px;color:var(--ice);text-align:right;font-variant-numeric:tabular-nums;
            grid-column:2;margin-top:-3px;margin-bottom:1px}

  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;
                    margin:0;display:block;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:99px;
    background:linear-gradient(90deg,var(--c,var(--cyan)) var(--p,50%),rgba(234,241,255,.1) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:22px;height:22px;border-radius:50%;margin-top:-8px;background:#fff;
    border:2px solid var(--c,var(--cyan));transition:transform .16s var(--e)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
  input[type=range].center::-webkit-slider-runnable-track{
    background:linear-gradient(90deg,rgba(234,241,255,.1) 0%,rgba(234,241,255,.1) var(--lo,50%),
      var(--c,var(--cyan)) var(--lo,50%),var(--c,var(--cyan)) var(--hi,50%),
      rgba(234,241,255,.1) var(--hi,50%),rgba(234,241,255,.1) 100%)}
  input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:rgba(234,241,255,.1)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;
    border:2px solid var(--c,var(--cyan))}

  .eq{margin-top:auto;padding-top:12px;border-top:1px solid var(--edge2);flex:0 0 auto}
  .eq-title{font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:700;margin-bottom:12px;text-align:center}
  .knob-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;justify-items:center}

  .knob{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;touch-action:none;width:100%}
  .knob:active{cursor:grabbing}

  .knob-dial{position:relative;width:100%;aspect-ratio:1 / 1;max-width:100px;max-height:100px;
    border-radius:50%;
    background:radial-gradient(circle at 50% 50%,var(--deep) 0%,var(--panel) 55%,var(--mod) 75%,#050810 100%);
    border:2px solid var(--k-color,var(--cyan));
    box-shadow:inset 0 0 12px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.04);
    display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;
    transition:box-shadow .2s var(--e),border-color .2s var(--e);overflow:hidden}
  .knob.active .knob-dial{
    box-shadow:inset 0 0 12px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.08),
      0 0 20px color-mix(in srgb,var(--k-color,var(--cyan)) 40%,transparent)}
  .knob-dial::before{content:'';position:absolute;inset:4px;border-radius:50%;
    background:repeating-conic-gradient(from -135deg,rgba(234,241,255,.28) 0deg 1deg,transparent 1deg 15deg);
    -webkit-mask:radial-gradient(circle,transparent 0,transparent 68%,#000 69%,#000 78%,transparent 79%);
    mask:radial-gradient(circle,transparent 0,transparent 68%,#000 69%,#000 78%,transparent 79%);
    pointer-events:none;opacity:.55}
  .knob-indicator{position:absolute;inset:0;pointer-events:none;transform-origin:50% 50%;
                  transition:transform .05s linear}
  .knob-indicator::before{content:'';position:absolute;left:50%;top:6%;width:4px;height:26%;
    border-radius:2px;background:var(--k-color,var(--cyan));transform:translateX(-50%);
    box-shadow:0 0 8px var(--k-color,var(--cyan))}
  .knob-dial::after{content:'';position:absolute;inset:38%;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#4a5570 0%,#2a3248 55%,#1a2033 100%);
    box-shadow:inset 0 1px 2px rgba(255,255,255,.1),inset 0 -1px 3px rgba(0,0,0,.6);pointer-events:none}
  .knob-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .knob-value{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;
              color:var(--k-color,var(--cyan));min-height:16px;transition:color .15s var(--e)}
  .knob.active .knob-value{color:#fff;text-shadow:0 0 10px var(--k-color,var(--cyan))}

  /* ============================================================
     DRAWER
     ============================================================ */
  .drawer{position:fixed;left:0;right:0;bottom:0;top:auto;height:88vh;height:88dvh;max-height:88vh;
    width:100%;z-index:40;background:linear-gradient(180deg,#0B1020,#06080F);
    border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--edge2);
    transform:translateY(101%);transition:transform .32s var(--e);
    display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 -20px 60px rgba(0,0,0,.6)}
  .drawer.open{transform:translateY(0)}

  .drawer-handle{display:flex;align-items:center;justify-content:center;padding:10px 0 6px;flex:0 0 auto;cursor:grab}
  .drawer-handle i{width:48px;height:4px;border-radius:99px;background:rgba(140,190,255,.35)}

  .dhead{display:flex;align-items:center;justify-content:space-between;padding:2px 20px 12px;flex:0 0 auto;gap:10px}
  .dhead h2{font-size:13px;letter-spacing:.2em;margin:0;color:var(--cyan);font-weight:800}
  .dhead button{width:40px;height:40px;border-radius:50%;border:1px solid var(--edge2);
    background:rgba(234,241,255,.06);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
  .dhead button:active{transform:scale(.92)}

  .dcontent{flex:1 1 auto;display:flex;flex-direction:column;
    padding:0 20px calc(env(safe-area-inset-bottom) + 20px) 20px;min-height:0;overflow:hidden}

  /* Formulaire d'ajout dans le drawer : nom + url */
  .addtop{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;flex:0 0 auto}
  .addtop .row2{display:flex;gap:6px}
  .addtop .txtin{min-height:44px;font-size:14px;padding:0 14px}
  .addtop .row2 .txtin{flex:1;min-width:0}
  .addtop .pill{min-height:44px;font-size:14px}

  .searchbox{margin-bottom:10px;flex:0 0 auto}

  .txtin{width:100%;font:inherit;color:var(--ice);background:rgba(234,241,255,.05);
    border:1px solid var(--edge2);border-radius:12px;min-height:44px;padding:0 14px;font-size:14px;
    -webkit-appearance:none;appearance:none}
  .txtin:focus{outline:none;border-color:var(--cyan)}

  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 0 10px;padding-bottom:4px;flex:0 0 auto}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;white-space:nowrap;font-size:13px;color:var(--muted);
    background:rgba(234,241,255,.05);border:1px solid var(--edge);
    border-radius:100px;min-height:36px;padding:0 16px}
  .tabs button.sel{background:linear-gradient(135deg,var(--cyan),#0E8BDD);color:#03121A;
    border-color:transparent;font-weight:700}
  .tabs button.fav-tab.sel{
    background:linear-gradient(135deg,var(--magenta),#B01E75);color:#fff;
    box-shadow:0 0 12px rgba(255,61,158,.4)}

  .listwrap{flex:1 1 auto;overflow-y:auto;min-height:0;padding-right:2px;-webkit-overflow-scrolling:touch}
  .listwrap::-webkit-scrollbar{width:6px}
  .listwrap::-webkit-scrollbar-thumb{background:rgba(234,241,255,.13);border-radius:99px}

  .rowlist{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;
    border-radius:12px;border:1px solid transparent;transition:background .15s var(--e),border-color .15s var(--e)}
  .rowlist + .rowlist{margin-top:3px}
  .rowlist:hover{background:rgba(234,241,255,.05)}
  .rowlist.play{background:linear-gradient(90deg,rgba(47,231,255,.16),rgba(47,231,255,.02));border-color:rgba(47,231,255,.45)}
  .rowlist .dot{width:9px;height:9px;border-radius:50%;flex:none;background:rgba(234,241,255,.14)}
  .rowlist.play .dot{background:var(--cyan)}
  .rowlist .info{flex:1;min-width:0}
  .rowlist .nm{font-weight:600;font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowlist.play .nm{color:var(--cyan)}
  .rowlist .desc{font-size:13px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Étoile plus visible */
  .rowlist .star{
    font-size:22px;
    color:rgba(234,241,255,.25);
    padding:8px 10px;
    flex:none;
    transition:all .18s var(--e);
    border-radius:10px;
    background:rgba(234,241,255,.03);
  }
  .rowlist .star:hover{
    color:var(--magenta);
    transform:scale(1.15);
    background:rgba(255,61,158,.1);
  }
  .rowlist .star.is{
    color:var(--magenta);
    background:rgba(255,61,158,.15);
    text-shadow:0 0 10px var(--magenta);
  }

  /* Bouton de suppression sur les flux ajoutés */
  .rowlist .del{
    font-size:18px;
    color:rgba(234,241,255,.2);
    padding:6px 8px;
    flex:none;
    transition:all .18s var(--e);
    border-radius:8px;
  }
  .rowlist .del:hover{
    color:#FF3D9E;
    background:rgba(255,61,158,.12);
  }

  .msg{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.5;flex:0 0 auto}
  .msg b{color:var(--ice)}

  .scrim{position:fixed;inset:0;background:rgba(3,5,10,.6);z-index:39;opacity:0;pointer-events:none;transition:opacity .25s var(--e)}
  .scrim.open{opacity:1;pointer-events:auto}

  @media (max-width:600px){
    .app{padding:8px;gap:6px}
    .topbar{padding:12px 14px}
    .now{font-size:18px}
    .console{padding:12px 14px}
    .row{grid-template-columns:56px 1fr;gap:10px;margin-bottom:8px}
    .dcontent{padding:0 14px calc(env(safe-area-inset-bottom) + 14px) 14px}
  }
  @media (max-height:520px){.wavewrap{display:none}}
</style>
</head>
<body>
<div class="app">
  <div class="card topbar">
    <div class="brand-row">
      <span class="orb"></span>
      <span class="brand">RADIO THE CORE <small>• MINI</small></span>
    </div>
    <div class="now" id="npName">Rien en lecture</div>
    <div class="sub" id="npState">Ouvre les stations pour choisir</div>

    <div class="add-form">
      <input type="text" class="txtin" id="quickName" autocapitalize="words"
             autocorrect="off" placeholder="Nom (facultatif)">
      <div class="row2">
        <input type="text" class="txtin" id="quickUrl" inputmode="url"
               autocapitalize="off" autocorrect="off" placeholder="Coller un lien de flux…">
        <button class="pill" id="quickAdd" style="flex:0 0 auto;padding:0 18px;font-size:20px;font-weight:700">＋</button>
      </div>
    </div>

    <div class="tb-btns">
      <button class="pill" id="power">▶ Écouter</button>
      <button class="pill ghost" id="openDrawer">☰ Stations</button>
    </div>
  </div>

  <div class="card wavewrap">
    <div class="wave" id="wave"></div>
  </div>

  <div class="card console">
    <div class="ctitle">
      <h2>CONSOLE</h2>
      <span class="val" id="statusMini">En veille</span>
    </div>

    <div class="row">
      <span class="lbl">VOL</span>
      <input type="range" id="volume" min="-24" max="12" step="0.5" value="0">
      <span class="val" id="volVal">0.0 dB</span>
    </div>

    <div class="row">
      <span class="lbl">BAL</span>
      <input type="range" class="center" id="balance" min="-1" max="1" step="0.01" value="0">
      <span class="val" id="balVal">Centre</span>
    </div>

    <div class="eq">
      <div class="eq-title">ÉGALISEUR</div>
      <div class="knob-row">
        <div class="knob" id="knobBass" style="--k-color:#FF3D9E"
             data-min="-15" data-max="15" data-step="1" data-value="0">
          <div class="knob-dial"><div class="knob-indicator"></div></div>
          <div class="knob-value" id="bassVal">0</div>
          <div class="knob-label">Bass</div>
        </div>
        <div class="knob" id="knobMid" style="--k-color:#2FE7FF"
             data-min="-15" data-max="15" data-step="1" data-value="0">
          <div class="knob-dial"><div class="knob-indicator"></div></div>
          <div class="knob-value" id="midVal">0</div>
          <div class="knob-label">Mid</div>
        </div>
        <div class="knob" id="knobTreble" style="--k-color:#B9FF45"
             data-min="-15" data-max="15" data-step="1" data-value="0">
          <div class="knob-dial"><div class="knob-indicator"></div></div>
          <div class="knob-value" id="trelVal">0</div>
          <div class="knob-label">High</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-modal="true">
  <div class="drawer-handle" id="drawerHandle"><i></i></div>
  <div class="dhead">
    <h2>STATIONS</h2>
    <button id="closeDrawer" aria-label="Fermer">✕</button>
  </div>
  <div class="dcontent">
    <div class="addtop">
      <input type="text" class="txtin" id="url" inputmode="url"
             autocapitalize="off" autocorrect="off" placeholder="Coller un lien de flux…">
      <div class="row2">
        <input type="text" class="txtin" id="customName" autocapitalize="words"
               autocorrect="off" placeholder="Nom (facultatif)">
        <button class="pill" id="addUrl" style="flex:0 0 auto;padding:0 20px">＋ Ajouter</button>
      </div>
    </div>

    <div class="searchbox">
      <input type="text" class="txtin" id="search" placeholder="Chercher une station…"
             autocapitalize="off" autocorrect="off">
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="listwrap">
      <div id="list"></div>
      <div class="msg" id="listMsg"></div>
    </div>
  </div>
</aside>

<script>
(function(){
"use strict";

const CORS_PROXY = 'https://soft-brook-0e52.stefikare.workers.dev/?url=';

function proxify(u) {
  if (!u) return u;
  u = u.trim();
  if (u.indexOf(CORS_PROXY) === 0) return u;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  if (u.indexOf('http://') === 0) return CORS_PROXY + encodeURIComponent(u);
  return u;
}

/* =========================================================
   ÉTAT
   ========================================================= */
let audioCtx = null;
let mixEl = null;
let player = null;
let srcNode = null;
let pannerNode = null;
let gainNode = null;
let bassFilter = null;
let midFilter = null;
let trebleFilter = null;
let softLimiter = null;
let analyser = null;
let _waveData = null;
let graphBuilt = false;

let isPlaying = false;
let currentStation = null;
let sessionId = 0;
let usingMix = false;

const RETRY_BASE = 800;
const RETRY_MAX = 20000;
const GOOD_PLAYBACK_MS = 15000;

/* =========================================================
   GRAPHE AUDIO
   ========================================================= */
function buildGraph() {
  if (graphBuilt) return;

  const AC = window.AudioContext || window.webkitAudioContext;
  try {
    audioCtx = new AC({ latencyHint: 'playback', sampleRate: 44100 });
  } catch (e) {
    try { audioCtx = new AC({ latencyHint: 'playback' }); }
    catch (e2) { audioCtx = new AC(); }
  }

  mixEl = new Audio();
  mixEl.crossOrigin = 'anonymous';
  mixEl.setAttribute('playsinline', '');
  mixEl.preload = 'none';

  srcNode = audioCtx.createMediaElementSource(mixEl);

  pannerNode = audioCtx.createStereoPanner(); pannerNode.pan.value = 0;
  gainNode = audioCtx.createGain(); gainNode.gain.value = 1;

  bassFilter = audioCtx.createBiquadFilter();
  bassFilter.type = 'lowshelf'; bassFilter.frequency.value = 250; bassFilter.gain.value = 0;

  midFilter = audioCtx.createBiquadFilter();
  midFilter.type = 'peaking'; midFilter.frequency.value = 1200;
  midFilter.Q.value = 0.9; midFilter.gain.value = 0;

  trebleFilter = audioCtx.createBiquadFilter();
  trebleFilter.type = 'highshelf'; trebleFilter.frequency.value = 4000;
  trebleFilter.gain.value = 0;

  softLimiter = audioCtx.createDynamicsCompressor();
  softLimiter.threshold.value = -1.5;
  softLimiter.knee.value = 6;
  softLimiter.ratio.value = 12;
  softLimiter.attack.value = 0.003;
  softLimiter.release.value = 0.15;

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  analyser.smoothingTimeConstant = 0.4;

  srcNode.connect(pannerNode);
  pannerNode.connect(gainNode);
  gainNode.connect(bassFilter);
  bassFilter.connect(midFilter);
  midFilter.connect(trebleFilter);
  trebleFilter.connect(analyser);
  analyser.connect(softLimiter);
  softLimiter.connect(audioCtx.destination);

  _waveData = new Uint8Array(analyser.fftSize);

  player = new Audio();
  player.setAttribute('playsinline', '');
  player.preload = 'none';

  graphBuilt = true;
}

/* =========================================================
   LECTURE
   ========================================================= */
function tryPlay(url, useMix, mySession) {
  return new Promise((resolve) => {
    const el = useMix ? mixEl : player;
    if (!el) { resolve(false); return; }

    let done = false, started = false, startupTimer = null;

    const cleanup = () => {
      el.onplaying = null; el.onerror = null;
      el.onended = null; el.onstalled = null;
    };
    const finish = (ok) => {
      if (done) return;
      done = true;
      if (startupTimer) { clearTimeout(startupTimer); startupTimer = null; }
      cleanup();
      resolve(ok);
    };

    el.onplaying = () => {
      if (started) return;
      started = true;
      if (startupTimer) { clearTimeout(startupTimer); startupTimer = null; }
      usingMix = useMix;
      setStatus(useMix ? '▶ En direct · EQ actif' : '▶ En direct · sans EQ');
      render();
    };
    el.onerror = () => finish(false);
    el.onended = () => finish(started);

    startupTimer = setTimeout(() => { if (!started) finish(false); }, 15000);

    try {
      el.src = url;
      el.load();
      const p = el.play();
      if (p && p.catch) p.catch(() => { if (!started) finish(false); });
    } catch (e) { finish(false); }
  });
}

async function streamSession(station, mySession) {
  const rawUrls = [station.u].concat(station.alts || []).filter(Boolean);

  const plan = [];
  rawUrls.forEach(u => {
    const proxied = proxify(u);
    if (proxied !== u) plan.push({ url: proxied, mix: true });
    plan.push({ url: u, mix: true });
    plan.push({ url: u, mix: false });
    if (proxied !== u) plan.push({ url: proxied, mix: false });
  });

  console.info('[Core Mini] Plan :', plan.map(p => p.url + ' [' + (p.mix ? 'mix' : 'clean') + ']'));

  let idx = 0, attempt = 0;

  while (isPlaying && sessionId === mySession) {
    const step = plan[idx % plan.length];
    setStatus('⏳ Essai ' + ((idx % plan.length) + 1) + '/' + plan.length +
              (step.mix ? ' · EQ' : ' · direct'));

    const startTs = Date.now();
    const ok = await tryPlay(step.url, step.mix, mySession);
    const playedFor = Date.now() - startTs;

    if (!isPlaying || sessionId !== mySession) return;

    if (ok && playedFor >= GOOD_PLAYBACK_MS) {
      attempt = 0;
      const winner = plan[idx % plan.length];
      plan.length = 0;
      plan.push(winner);
      rawUrls.forEach(u => {
        const proxied = proxify(u);
        if (proxied !== u) plan.push({ url: proxied, mix: winner.mix });
        plan.push({ url: u, mix: winner.mix });
      });
      idx = 0;
      setStatus('🔄 Reconnexion...');
    } else {
      attempt++;
      idx++;
      if (attempt > plan.length * 3) {
        setStatus('❌ Station inaccessible. Pause 10s...');
        await new Promise(r => setTimeout(r, 10000));
        attempt = 0; idx = 0;
      }
    }

    try { mixEl.pause(); } catch(e) {}
    try { mixEl.removeAttribute('src'); mixEl.load(); } catch(e) {}
    try { player.pause(); } catch(e) {}
    try { player.removeAttribute('src'); player.load(); } catch(e) {}

    if (!isPlaying || sessionId !== mySession) return;

    const delay = Math.min(RETRY_BASE * Math.pow(1.6, Math.max(0, attempt - 1)), RETRY_MAX);
    await new Promise(r => setTimeout(r, delay + Math.random() * 500));
  }
}

async function togglePlay(station) {
  if (isPlaying) {
    isPlaying = false;
    sessionId++;
    try { mixEl.pause(); } catch(e) {}
    try { mixEl.removeAttribute('src'); mixEl.load(); } catch(e) {}
    try { player.pause(); } catch(e) {}
    try { player.removeAttribute('src'); player.load(); } catch(e) {}
    render();
    setStatus('⏹️ Arrêté.');
    return;
  }
  if (!station) { setStatus('⚠️ Aucune station.'); return; }

  currentStation = station;
  isPlaying = true;
  const mySession = ++sessionId;

  buildGraph();
  if (audioCtx.state === 'suspended') {
    try { await audioCtx.resume(); } catch(e) {}
  }

  render();
  try { await streamSession(station, mySession); }
  catch (err) {
    if (sessionId !== mySession) return;
    setStatus('❌ ' + err.message);
    isPlaying = false;
    render();
  }
}

/* =========================================================
   FILTRAGE + AFFICHAGE
   ========================================================= */
function filterRows() {
  if (query) {
    const q = query.toLowerCase();
    return CORE.concat(online).filter(s =>
      (s.n + ' ' + (s.g||'') + ' ' + (s.c||'')).toLowerCase().indexOf(q) >= 0);
  }
  if (tab === 'fav') return favs.slice();
  if (tab === 'all') return CORE.slice();
  if (tab === 'custom') {
    return CORE.filter(s => s.custom === true);
  }
  return CORE.filter(s => s.c === tab);
}

function paintList() {
  const rows = filterRows();
  listEl.innerHTML = '';

  if (!rows.length && tab === 'fav') {
    listMsg.innerHTML = '<b>Aucun favori pour l\'instant.</b><br>Touche l\'étoile ★ d\'une station pour l\'ajouter.';
    return;
  }
  if (!rows.length && tab === 'custom') {
    listMsg.innerHTML = '<b>Aucune radio ajoutée.</b><br>Colle un lien de flux dans le champ ci-dessus.';
    return;
  }
  if (!rows.length && query) {
    listMsg.innerHTML = '<b>Rien trouvé.</b>';
    return;
  }
  listMsg.textContent = '';

  rows.forEach(st => {
    const r = document.createElement('button');
    r.className = 'rowlist';
    if (currentStation && currentStation.u === st.u) r.className += ' play';

    const isFav = favs.some(x => x.u === st.u);
    const isCustom = st.custom === true;

    r.innerHTML = '<i class="dot"></i>'
      + '<span class="info"><span class="nm"></span><span class="desc"></span></span>'
      + (isCustom ? '<span class="del" title="Supprimer">✕</span>' : '')
      + '<span class="star' + (isFav ? ' is' : '') + '" title="Favori">★</span>';

    r.querySelector('.nm').textContent = st.n;
    const descParts = [];
    if (st.g) descParts.push(st.g);
    if (st.q) descParts.push(st.q);
    r.querySelector('.desc').textContent = descParts.join(' · ');

    r.addEventListener('click', (ev) => {
      /* Ignore si on a cliqué sur l'étoile ou la croix */
      if (ev.target.closest('.star') || ev.target.closest('.del')) return;
      playStation(st);
      openDrawer(false);
    });

    /* Étoile : toggle favori */
    r.querySelector('.star').addEventListener('click', ev => {
      ev.stopPropagation(); ev.preventDefault();
      toggleFav(st);
    });

    /* Croix : supprimer un flux ajouté */
    const delBtn = r.querySelector('.del');
    if (delBtn) {
      delBtn.addEventListener('click', ev => {
        ev.stopPropagation(); ev.preventDefault();
        deleteCustomStation(st);
      });
    }

    listEl.appendChild(r);
  });
}

function toggleFav(st) {
  const i = favs.findIndex(x => x.u === st.u);
  if (i >= 0) {
    favs.splice(i, 1);
  } else {
    favs.push(st);
  }
  saveFavs();
  paintList();
}

function deleteCustomStation(st) {
  /* Arrêt si c'est en cours de lecture */
  if (currentStation && currentStation.u === st.u && isPlaying) {
    togglePlay();
  }
  /* Retrait de CORE */
  const idx = CORE.findIndex(x => x.u === st.u);
  if (idx >= 0) CORE.splice(idx, 1);
  /* Retrait de customStations */
  customStations = customStations.filter(x => x.u !== st.u);
  saveCustomStations();
  /* Retrait des favoris */
  favs = favs.filter(x => x.u !== st.u);
  saveFavs();
  /* Retrait des plays */
  delete plays[st.u];
  savePlays();
  paintList();
}

function searchLibrary(q) {
  listMsg.innerHTML = '<b>Recherche…</b>';
  const base = 'https://de1.api.radio-browser.info/json/stations/search?hidebroken=true'
    + '&order=clickcount&reverse=true&limit=30&';
  Promise.all([
    fetch(base + 'tag=' + encodeURIComponent(q)).then(r => r.json()).catch(() => []),
    fetch(base + 'name=' + encodeURIComponent(q)).then(r => r.json()).catch(() => [])
  ]).then(sets => {
    if (query !== q) return;
    const have = {}, out = [];
    CORE.forEach(x => have[x.u] = 1);
    sets.forEach(rows => (rows || []).forEach(r => {
      const u = r.url_resolved || r.url;
      if (!u || u.indexOf('https://') !== 0 || have[u]) return;
      have[u] = 1;
      out.push({
        n: (r.name || '').trim().slice(0, 46) || 'Sans nom',
        g: (r.tags || '').split(',').slice(0, 2).join(', '),
        c: 'web',
        q: (r.bitrate ? r.bitrate + ' kbps' : ''),
        u: u, alts: []
      });
    }));
    online = out;
    listMsg.innerHTML = out.length
      ? '<b>' + out.length + ' stations trouvées.</b>'
      : '<b>Rien pour ce mot.</b>';
    paintList();
  }).catch(() => { listMsg.innerHTML = '<b>Bibliothèque injoignable.</b>'; });
}

/* =========================================================
   AJOUT DE FLUX — avec nom personnalisé
   ========================================================= */
function addStream(urlValue, nameValue, urlBox, nameBox) {
  let u = (urlValue || '').trim();
  if (!u) { listMsg.textContent = 'Colle un lien de flux.'; return; }

  const wasHttp = /^http:\/\//i.test(u);
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;

  /* Nom : celui fourni, sinon auto-généré */
  const name = (nameValue || '').trim() ||
               u.replace(/^https?:\/\//i, '').split('/')[0].slice(0, 30);

  /* Vérifier si la station existe déjà */
  const existing = CORE.find(x => x.u === u);
  if (existing) {
    if (urlBox) urlBox.value = '';
    if (nameBox) nameBox.value = '';
    listMsg.innerHTML = '<b>Cette radio est déjà dans ta liste.</b>';
    playStation(existing);
    return;
  }

  const st = {
    n: name,
    g: wasHttp ? 'Flux ajouté (proxy auto)' : 'Flux ajouté',
    c: 'all',
    q: '',
    u: u,
    alts: [],
    custom: true
  };

  /* Ajout à CORE + customStations + persistance */
  CORE.push(st);
  customStations.push(st);
  saveCustomStations();

  if (urlBox) urlBox.value = '';
  if (nameBox) nameBox.value = '';

  listMsg.innerHTML = wasHttp
    ? '<b>✓ « ' + name + ' » ajoutée.</b> HTTP → proxy HTTPS auto.'
    : '<b>✓ « ' + name + ' » ajoutée.</b>';

  /* Rafraîchir l'onglet "Mes ajouts" et lancer */
  tab = 'custom';
  tabsEl.querySelectorAll('button').forEach(x => {
    x.classList.toggle('sel', x.textContent === 'Mes ajouts');
  });

  paintList();
  playStation(st);
}

function fillPct(slider, centered) {
  const min = +slider.min, max = +slider.max, v = +slider.value;
  const pct = ((v - min) / (max - min)) * 100;
  if (centered) {
    const c = ((0 - min) / (max - min)) * 100;
    slider.style.setProperty('--lo', Math.min(c, pct) + '%');
    slider.style.setProperty('--hi', Math.max(c, pct) + '%');
  } else {
    slider.style.setProperty('--p', pct + '%');
  }
}

/* =========================================================
   Knobs
   ========================================================= */
function createKnob(knobEl, onValueChange) {
  const dial = knobEl.querySelector('.knob-dial');
  const indicator = knobEl.querySelector('.knob-indicator');
  const valueEl = knobEl.querySelector('.knob-value');

  const min = parseFloat(knobEl.dataset.min);
  const max = parseFloat(knobEl.dataset.max);
  const step = parseFloat(knobEl.dataset.step) || 1;
  const range = max - min;

  let value = parseFloat(knobEl.dataset.value) || 0;
  let dragging = false, startY = 0, startValue = 0;

  function update(v, notify) {
    v = Math.round(v / step) * step;
    v = Math.max(min, Math.min(max, v));
    value = v;
    knobEl.dataset.value = v;
    const angle = -135 + ((v - min) / range) * 270;
    indicator.style.transform = 'rotate(' + angle + 'deg)';
    valueEl.textContent = (v > 0 ? '+' : '') + v;
    if (notify && onValueChange) onValueChange(v);
  }

  dial.addEventListener('pointerdown', (e) => {
    dragging = true; startY = e.clientY; startValue = value;
    knobEl.classList.add('active');
    try { dial.setPointerCapture(e.pointerId); } catch(err) {}
    e.preventDefault();
  });
  dial.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dy = startY - e.clientY;
    const delta = (dy / 180) * range;
    update(startValue + delta, true);
    e.preventDefault();
  });
  function end(e) {
    if (!dragging) return;
    dragging = false;
    knobEl.classList.remove('active');
    try { dial.releasePointerCapture(e.pointerId); } catch(err) {}
  }
  dial.addEventListener('pointerup', end);
  dial.addEventListener('pointercancel', end);
  dial.addEventListener('dblclick', () => { update(0, true); });

  update(value, false);
}

let idle = 0, lastFrame = 0;
(function loop(now) {
  requestAnimationFrame(loop);
  const t = now || performance.now();
  if (t - lastFrame < 40) return;
  lastFrame = t;

  const playing = isPlaying;
  const live = playing && usingMix && analyser && _waveData;

  if (live) {
    try {
      analyser.getByteTimeDomainData(_waveData);
      const step = Math.floor(_waveData.length / BARS);
      for (let k = 0; k < BARS; k++) {
        const idx = Math.min(k * step + 20, _waveData.length - 1);
        const h = Math.max(3, Math.abs(_waveData[idx] - 128) / 128 * 34);
        barEls[k].style.height = h + 'px';
      }
    } catch(e){}
  } else {
    idle += 0.06;
    for (let k = 0; k < BARS; k++) {
      const h = playing
        ? (9 + Math.sin(idle + k*0.4) * 7 + Math.sin(idle*1.7 + k) * 3)
        : 3;
      barEls[k].style.height = h + 'px';
    }
  }
})();

paintList();
render();
setStatus('Ouvre les stations pour choisir');

})();
</script>
</body>
</html>
